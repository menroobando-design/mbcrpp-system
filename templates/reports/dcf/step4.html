{% extends "layouts/base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-lg">

        <div class="card-header bg-success text-white">

            <h3>
                Manila Bayanihan Form 2.2
            </h3>

            <h5 class="mb-0">
                Step 4 of 10
            </h5>

            <small>
                Weekly Clean-Up Drives
            </small>

        </div>

        <div class="card-body">

            <div class="progress mb-4">

                <div class="progress-bar bg-success"
                     role="progressbar"
                     style="width:40%;">

                    40%

                </div>

            </div>

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">

                        Number of Clean-Up Drives Conducted

                    </label>

                    {{ form.cleanup_drives }}

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Number of Participants

                    </label>

                    {{ form.cleanup_participants }}

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Areas Covered

                    </label>

                    {{ form.cleanup_area }}

                </div>

                <div class="d-flex justify-content-between">

                    <a href="{% url 'dcf_step3' report.id %}"
                       class="btn btn-secondary">

                        ← Previous

                    </a>

                    <button class="btn btn-success">

                        Save & Continue →

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
