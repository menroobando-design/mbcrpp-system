{% extends "layouts/base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-lg">

        <div class="card-header bg-success text-white">

            <h3>
                Manila Bayanihan Form 2.2
            </h3>

            <h5 class="mb-0">
                Step 2 of 10
            </h5>

            <small>
                Barangay Solid Waste Management Committee
            </small>

        </div>

        <div class="card-body">

            <!-- Progress -->

            <div class="progress mb-4">

                <div class="progress-bar bg-success"
                     style="width:20%;">

                    20%

                </div>

            </div>

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">

                        Is there a Barangay SWM Committee?

                    </label>

                    {{ form.has_bswmc }}

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Number of Members

                    </label>

                    {{ form.bswmc_members }}

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Number of Meetings Conducted

                    </label>

                    {{ form.bswmc_meetings }}

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Executive Order Available?

                    </label>

                    {{ form.has_eo }}

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Barangay SWM Plan Available?

                    </label>

                    {{ form.has_bswm_plan }}

                </div>

                <div class="d-flex justify-content-between">

                    <a href="{% url 'dcf_step1' %}"
                       class="btn btn-secondary">

                        ← Previous

                    </a>

                    <button class="btn btn-success">

                        Save & Continue →

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
